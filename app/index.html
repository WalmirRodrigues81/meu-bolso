<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meu Bolso</title>
  <meta name="theme-color" content="#0b2545">
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone.svg">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Tela de entrada -->
  <main id="tela-entrada" class="tela-entrada" hidden>
    <div class="cartao entrada">
      <img src="icone.svg" alt="" class="logo" width="64" height="64">
      <h1>Meu Bolso</h1>
      <form id="form-entrada" novalidate>
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" minlength="6" required>
        <p id="msg-entrada" class="mensagem" role="alert"></p>
        <button type="submit" id="botao-entrar" class="botao principal">Entrar</button>
        <button type="button" id="botao-criar" class="botao secundario">Criar conta</button>
      </form>
    </div>
  </main>

  <!-- Tela principal -->
  <main id="tela-app" class="tela-app" hidden>
    <header class="topo">
      <h1 class="titulo-marca">
        <!-- Saco de dinheiro verde com $ preto -->
        <svg class="saco" viewBox="0 0 64 64" width="32" height="32" aria-hidden="true">
          <path d="M24 8 L40 8 L35 18 L29 18 Z" fill="#2e9e4f"/>
          <rect x="26" y="17" width="12" height="5" rx="2.5" fill="#1f7a3a"/>
          <path d="M28 21 C14 26 8 38 8 46 C8 56 18 60 32 60 C46 60 56 56 56 46 C56 38 50 26 36 21 Z" fill="#2e9e4f"/>
          <text x="32" y="51" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#000000">$</text>
        </svg>
        Meu Bolso
      </h1>
      <button type="button" id="botao-sair" class="botao-link">Sair</button>
    </header>

    <section class="cartao total">
      <p class="rotulo" id="rotulo-mes">Gasto no mês</p>
      <p class="valor-total" id="valor-total">R$ 0,00</p>
      <p class="rotulo" id="media-dia" style="margin: -8px 0 12px;">Média de R$ 0,00 por dia</p>
      <ul id="barras" class="barras"></ul>
    </section>

    <section class="cartao">
      <h2>Lançar à mão</h2>
      <form id="form-gasto" novalidate>
        <label for="valor">Valor (R$)</label>
        <input id="valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" required>
        <label for="descricao">Onde ou com o quê</label>
        <input id="descricao" type="text" placeholder="Ex.: almoço no centro" autocomplete="off">
        <fieldset>
          <legend>Categoria</legend>
          <div id="categorias" class="categorias"></div>
        </fieldset>
        <label for="data">Data</label>
        <input id="data" type="date" required>
        <p id="msg-gasto" class="mensagem" role="alert"></p>
        <button type="submit" id="botao-salvar" class="botao principal">Salvar</button>
      </form>
    </section>

    <section id="cartao-resumo" class="cartao resumo" hidden>
      <h2>Resumo da semana</h2>
      <p id="texto-resumo"></p>
    </section>

    <section class="cartao assistente">
      <h2>Assistente</h2>
      <form id="form-assistente" novalidate>
        <label for="frase" class="oculto">Escreva o gasto numa frase</label>
        <div class="linha-voz">
          <input id="frase" type="text" placeholder="Ex.: almoço 35 reais" autocomplete="off">
          <button type="button" id="botao-voz" class="botao secundario botao-voz" aria-label="Falar o gasto">🎤 Falar</button>
        </div>
        <p id="dica-voz" class="dica" hidden>Para falar, use o microfone do teclado do celular.</p>
        <div class="linha-botoes">
          <button type="submit" class="botao principal">Enviar</button>
          <button type="button" id="botao-foto" class="botao secundario">Foto do cupom</button>
        </div>
        <button type="button" id="botao-galeria" class="botao secundario" style="margin-top: 8px;">Escolher da galeria</button>
        <p id="msg-assistente" class="mensagem aviso" role="status"></p>
      </form>
    </section>

    <section class="cartao">
      <h2>Gastos do mês</h2>
      <p id="lista-vazia" class="vazio">Nenhum gasto lançado neste mês.</p>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <p id="carregando" class="carregando">Carregando…</p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="configuracao.js"></script>
  <script src="app.js"></script>
</body>
</html>
